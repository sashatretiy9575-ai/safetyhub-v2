name: Prune Vercel deployments

# Vercel keeps every deployment forever. After each successful deployment this
# keeps the three newest successful production deployments, plus whatever the
# production domains serve, and deletes the rest. A build still running, or a
# failed deployment newer than the last successful one, waits for the next run.
# The hourly run starts the cleanup on its own once the token is in place.
on:
  deployment_status:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: safetyhub-prune-vercel-deployments
  cancel-in-progress: false

jobs:
  prune:
    name: prune-vercel-deployments
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The owner saved the token as the repository secret NAME (13 September 2026).
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.NAME }}
      VERCEL_PROJECT: safetyhub-v2
      VERCEL_TEAM_SLUG: relirdghs-projects

    steps:
      - name: Report a missing token
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::Repository secret VERCEL_TOKEN is not set, so no deployment was deleted."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.VERCEL_TOKEN != ''
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 24

      - name: Delete all but the three newest successful deployments
        if: env.VERCEL_TOKEN != ''
        run: node scripts/ops/prune-vercel-deployments.mjs --keep=3
