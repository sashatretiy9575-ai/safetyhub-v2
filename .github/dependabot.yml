version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    ignore:
      # TypeScript 7 ships without the JavaScript compiler API that
      # typescript-eslint and eslint-config-next require; @types/node must
      # track the Node 24 runtime declared in engines and used by Vercel/CI.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      production-updates:
        dependency-type: production
        update-types:
          - patch
          - minor
      development-updates:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Asia/Almaty
    open-pull-requests-limit: 3
