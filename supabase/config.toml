project_id = "safetyhub"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Код для входа в SafetyHub"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Код для создания аккаунта SafetyHub"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Пароль в SafetyHub не используется"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Приглашения с паролем в SafetyHub отключены"
content_path = "./supabase/templates/invite.html"

# This runs before every Auth access token is issued. The target function is
# created by migration 20260831115000_passwordless_auth_provider_guard.sql, so
# apply database migrations before pushing this Auth config to a new project.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/enforce_email_otp_access_token"

# A scheduler has no user JWT. The function verifies its own high-entropy
# STORAGE_RECONCILER_SECRET bearer before it creates a service-role client.
[functions.storage-reconciler]
verify_jwt = false
