project_id = "safetyhub"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
# Plain SMTP for the app's send-email hook on a local stand (SAFETYHUB_SMTP_TLS=none).
smtp_port = 54325

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/login?email_locale=ru", "http://localhost:3000/kk/auth/login?email_locale=kk", "http://localhost:3000/en/auth/login?email_locale=en"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
# The Plesk mailbox takes about 50 messages/hour; ten stay in reserve for the
# outbox retries. Mirror any change in SUPABASE_AUTH_EMAIL_SENT_PER_HOUR.
email_sent = 40

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "{{ if (eq .RedirectTo \"https://safetyhub.kz/en/auth/login?email_locale=en\") }}SafetyHub: your sign-in code{{ else if (eq .RedirectTo \"https://safetyhub.kz/kk/auth/login?email_locale=kk\") }}SafetyHub: кіру коды{{ else if (eq .RedirectTo \"https://safetyhub.kz/auth/login?email_locale=ru\") }}SafetyHub: код для входа{{ else if eq .Data.locale \"en\" }}SafetyHub: your sign-in code{{ else if eq .Data.locale \"kk\" }}SafetyHub: кіру коды{{ else }}SafetyHub: код для входа{{ end }}"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "{{ if (eq .RedirectTo \"https://safetyhub.kz/en/auth/login?email_locale=en\") }}SafetyHub: your sign-up code{{ else if (eq .RedirectTo \"https://safetyhub.kz/kk/auth/login?email_locale=kk\") }}SafetyHub: тіркелу коды{{ else if (eq .RedirectTo \"https://safetyhub.kz/auth/login?email_locale=ru\") }}SafetyHub: код для регистрации{{ else if eq .Data.locale \"en\" }}SafetyHub: your sign-up code{{ else if eq .Data.locale \"kk\" }}SafetyHub: тіркелу коды{{ else }}SafetyHub: код для регистрации{{ end }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ if eq .Data.locale \"en\" }}SafetyHub signs you in without a password{{ else if eq .Data.locale \"kk\" }}SafetyHub-қа кіру құпиясөзсіз{{ else }}В SafetyHub вход без пароля{{ end }}"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "{{ if eq .Data.locale \"en\" }}SafetyHub does not send invitations{{ else if eq .Data.locale \"kk\" }}SafetyHub-та шақырулар қолданылмайды{{ else }}Приглашения в SafetyHub не используются{{ end }}"
content_path = "./supabase/templates/invite.html"

# This runs before every Auth access token is issued. The target function is
# created by migration 20260831115000_passwordless_auth_provider_guard.sql, so
# apply database migrations before pushing this Auth config to a new project.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/enforce_email_otp_access_token"

# Auth hands every email to the Vercel app, which answers immediately and
# relays the message to the PS.kz mailbox in the background. Direct SMTP from
# Supabase to that mailbox exceeded the 10-second Auth request budget, which
# surfaced to users as a false "captcha expired" error. The app renders the
# same code/notice templates as supabase/templates and verifies the Standard
# Webhooks signature with SUPABASE_SEND_EMAIL_HOOK_SECRETS.
[auth.hook.send_email]
enabled = true
uri = "https://safetyhub.kz/api/auth/send-email"
secrets = "env(SUPABASE_SEND_EMAIL_HOOK_SECRETS)"

# A scheduler has no user JWT. The function verifies its own high-entropy
# STORAGE_RECONCILER_SECRET bearer before it creates a service-role client.
[functions.storage-reconciler]
verify_jwt = false

# Database webhooks and the minute sweep authenticate with an independent,
# high-entropy TELEGRAM_DISPATCHER_SECRET. User JWTs are never accepted here.
[functions.telegram-dispatcher]
verify_jwt = false
