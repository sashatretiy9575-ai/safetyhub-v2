<!doctype html>
<html lang="ru">
  <body style="margin:0;background:#f4f7f5;color:#173d2b;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:0 auto;padding:32px 20px">
      <div style="border-radius:20px;background:#ffffff;padding:32px;box-shadow:0 8px 30px rgba(23,61,43,.08)">
        <h1 style="margin:0 0 16px;font-size:24px;line-height:1.25">Подтвердите email в SafetyHub</h1>
        <p style="margin:0 0 20px;font-size:16px;line-height:1.6">
          Чтобы создать аккаунт, введите этот одноразовый код в SafetyHub:
        </p>
        <div style="margin:0 0 20px;border-radius:14px;background:#e7f5ed;padding:18px;text-align:center;font-family:Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:8px">
          {{ .Token }}
        </div>
        <p style="margin:0 0 12px;font-size:14px;line-height:1.6">
          Код действует один час и используется только один раз. Никому его не сообщайте.
        </p>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#5f7168">
          Если вы не создаёте аккаунт, просто проигнорируйте это письмо.
        </p>
      </div>
    </div>
  </body>
</html>
